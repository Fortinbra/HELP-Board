name: help-board

services:
  app:
    image: ${HELPBOARD_IMAGE:?Set HELPBOARD_IMAGE to the published GHCR digest}
    platform: linux/arm64
    restart: unless-stopped
    init: true
    ports:
      - "${HELPBOARD_BIND_IP:?Set PiTony's LAN IP}:${HELPBOARD_APP_PORT:-2026}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: '8080'
      ASPNETCORE_HTTPS_PORT: '443'
      AllowedHosts: help.becauseimclever.com;localhost;127.0.0.1
      ConnectionStrings__HelpBoard: ${DB_CONNECTION_STRING:?Set the PiDB connection string}
      FeatureManagement__DatabaseMigrationsApplyAtStartup: 'false'
      ReverseProxy__KnownProxy: ${HELPBOARD_PROXY_IP:?Set Nginx Proxy Manager's source IP}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: '1.0'
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

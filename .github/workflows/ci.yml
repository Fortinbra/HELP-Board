name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: dotnet restore HelpBoard.slnx
      - run: dotnet build HelpBoard.slnx --configuration Release --no-restore
      - run: dotnet test HelpBoard.slnx --configuration Release --no-build --no-restore
        env:
          ConnectionStrings__HelpBoard: Host=127.0.0.1;Database=ci;Username=ci
          FeatureManagement__DatabaseMigrationsApplyAtStartup: 'false'
      - run: node --test tests/HelpBoard.Web.Tests/theme.test.cjs
